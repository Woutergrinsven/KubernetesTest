apiVersion: apps/v1
kind: Deployment
metadata:
  name: consoleapp2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consoleapp2
  template:
    metadata:
      labels:
        app: consoleapp2
    spec:
      containers:
        - name: consoleapp2
          image: consoleapp2:20260704-160202
          ports:
            - containerPort: 8080